services:
  - type: web
    name: badminton-queue-api
    runtime: node
    rootDir: .
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run prisma:push -- --skip-generate
    startCommand: npm run start
    healthCheckPath: /health/ready
    buildFilter:
      paths:
        - src/**
        - prisma/**
        - packages/domain/**
        - package.json
        - package-lock.json
        - render.yaml
