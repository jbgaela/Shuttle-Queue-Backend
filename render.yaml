services:
  - type: web
    name: badminton-queue-api
    runtime: node
    rootDir: .
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run prisma:push -- --skip-generate && npm run setup:ranking-tracking
    startCommand: npm run start
    healthCheckPath: /health/ready
    envVars:
      - key: PUBLIC_RANKING_EDGE_SECRET
        sync: false
      - key: PUBLIC_RANKING_ACCESS_ENABLED
        value: "true"
      - key: PUBLIC_RANKING_LOCATION_REQUIRED
        value: "true"
    buildFilter:
      paths:
        - src/**
        - prisma/**
        - packages/domain/**
        - package.json
        - package-lock.json
        - render.yaml
